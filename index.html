<!DOCTYPE html>
<html lang="pt-BR">

<head>

    href="./icons/icon-192.png"

  <title>App RH</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        Arial,
        sans-serif;

      background:
        #0f172a;

    }


    #app {

      width: 100%;
      height: 100%;

      position: relative;

    }


    #siteFrame {

      width: 100%;
      height: 100%;

      border: 0;

      display: block;

      background:
        white;

    }


    #loading {

      position: absolute;

      inset: 0;

      z-index: 100;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 14px;

      background:
        #0f172a;

      color:
        white;

      transition:
        opacity .25s ease;

      text-align: center;

      padding:
        20px;

    }


    #loading.hidden {

      opacity: 0;

      pointer-events: none;

    }


    .spinner {

      width: 38px;
      height: 38px;

      border:
        4px solid
        rgba(255,255,255,.25);

      border-top-color:
        white;

      border-radius:
        50%;

      animation:
        spin .8s linear infinite;

    }


    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }


    #loadingText {

      font-size: 14px;

      color:
        rgba(255,255,255,.85);

      line-height:
        1.4;

    }


    #offline {

      display: none;

      position: absolute;

      left: 12px;
      right: 12px;

      bottom: 12px;

      z-index: 20;

      padding:
        12px
        14px;

      border-radius:
        12px;

      background:
        rgba(15,23,42,.95);

      color:
        white;

      text-align:
        center;

      font-size:
        14px;

    }


    #install {

      display: none;

      position: fixed;

      right: 16px;

      z-index: 30;

      border: 0;

      border-radius:
        999px;

        18px;

        #2563eb;

      color:
        white;

        700;

        0 8px 24px
        rgba(0,0,0,.25);

        pointer;

  </style>

</head>


<body>


  <main id="app">


    <!-- =================================================
         LOADING
    ================================================== -->

    <div id="loading">

      <div class="spinner"></div>

      <strong>
        App RH
      </strong>

      <div id="loadingText">
        Verificando acesso...
      </div>

    </div>


    <!-- =================================================
         IFRAME
    ================================================== -->

    <iframe
      id="siteFrame"
      title="Sistema RH"
      allow="fullscreen; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>


    <!-- =================================================
         OFFLINE
    ================================================== -->

    <div id="offline">
      Sem conexão.
    </div>


    <!-- =================================================
         INSTALAR
    ================================================== -->

    <button
      id="install"
      type="button"
    >
      Instalar aplicativo
    </button>


  </main>


  <script>


    /* =====================================================
       CONFIGURAÇÃO
    ===================================================== */

    const URL_APP_RH =
      "https://script.google.com/a/*/macros/s/AKfycbzHA32fnNDd117Uc1SrRCZpGzz0L8YkIQ144SUpckVJ9t3eEaEHIbJYq3b0Ashnr5QyzQ/exec";


    const NOME_BANCO =
      "AppRHDB";


    const VERSAO_BANCO =
      1;


    const NOME_STORE =
      "usuario";


    const CHAVE_USUARIO =
      "usuarioAtual";


    const frame =
      document.getElementById(
        "siteFrame"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const loadingText =
      document.getElementById(
        "loadingText"
      );


    const offline =
      document.getElementById(
        "offline"
      );


    const installButton =
      document.getElementById(
        "install"
      );


    let redirecionamentoIniciado =
      false;


    /* =====================================================
       MOSTRAR MENSAGEM
    ===================================================== */

    function mostrarMensagem(
      mensagem
    ) {

      if(loadingText) {

        loadingText.textContent =
          mensagem;

      }

    }


    /* =====================================================
       ABRIR INDEXEDDB
    ===================================================== */

    function abrirBancoRH() {

      return new Promise(
        function(resolve, reject) {

          if(!window.indexedDB) {

            reject(
              new Error(
                "IndexedDB não está disponível."
              )
            );

            return;

          }


          const request =
            indexedDB.open(
              NOME_BANCO,
              VERSAO_BANCO
            );


          request.onupgradeneeded =
            function(event) {

              const db =
                event.target.result;


              if(
                !db.objectStoreNames.contains(
                  NOME_STORE
                )
              ) {

                db.createObjectStore(
                  NOME_STORE,
                  {
                    keyPath: "chave"
                  }
                );

              }

            };


          request.onsuccess =
            function(event) {

              resolve(
                event.target.result
              );

            };


          request.onerror =
            function(event) {

              reject(
                event.target.error ||
                new Error(
                  "Erro ao abrir IndexedDB."
                )
              );

            };

        }
      );

    }


    /* =====================================================
       LER USUÁRIO DO INDEXEDDB
    ===================================================== */

    async function obterUsuarioRH() {

      const db =
        await abrirBancoRH();


      return new Promise(
        function(resolve, reject) {


          const transaction =
            db.transaction(
              [NOME_STORE],
              "readonly"
            );


          const store =
            transaction.objectStore(
              NOME_STORE
            );


          const request =
            store.get(
              CHAVE_USUARIO
            );


          request.onsuccess =
            function(event) {

              resolve(
                event.target.result ||
                null
              );

            };


          request.onerror =
            function(event) {

              reject(
                event.target.error ||
                new Error(
                  "Erro ao buscar usuário."
                )
              );

            };


          transaction.oncomplete =
            function() {

              try {
                db.close();
              }
              catch(e) {}

            };


          transaction.onerror =
            function(event) {

              reject(
                event.target.error ||
                new Error(
                  "Erro na transação."
                )
              );

            };


        }
      );

    }


    /* =====================================================
       PEGAR TOKEN
    ===================================================== */

    async function obterTokenRH() {

      try {

        const usuario =
          await obterUsuarioRH();


        console.log(
          "======================================"
        );

        console.log(
          "🔎 APP RH - TOKEN"
        );

        console.log(
          "======================================"
        );

        console.log(
          "Usuário encontrado:",
          usuario
        );


        if(!usuario) {

          console.warn(
            "⚠️ Nenhum usuário encontrado."
          );

          return "";

        }


        const token =
          String(
            usuario.token ||
            ""
          ).trim();


        console.log(
          "Token encontrado:",
          token
        );


        return token;


      }
      catch(erro) {

        console.error(
          "❌ Erro ao obter token:",
          erro
        );

        return "";

      }

    }


    /* =====================================================
       REDIRECIONAR PARA O SISTEMA
    ===================================================== */

    async function iniciarSistema() {


      if(redirecionamentoIniciado) {

        return;

      }


      redirecionamentoIniciado =
        true;


      mostrarMensagem(
        "Verificando token..."
      );


      const token =
        await obterTokenRH();


      /* ===================================================
         TOKEN ENCONTRADO
      =================================================== */

      if(token) {


        console.log(
          "======================================"
        );

        console.log(
          "✅ TOKEN ENCONTRADO"
        );

        console.log(
          "Redirecionando com token..."
        );

        console.log(
          "======================================"
        );


        mostrarMensagem(
          "Token encontrado. Redirecionando..."
        );


        /*
         * encodeURIComponent evita problemas
         * caso o token contenha caracteres especiais.
         */

        const urlComToken =
          URL_APP_RH +
          "?page=login&token=" +
          encodeURIComponent(
            token
          );


        console.log(
          "URL FINAL:",
          urlComToken
        );


        /*
         * Pequeno atraso para que o usuário
         * consiga visualizar a mensagem.
         */

        setTimeout(
          function() {

            window.location.replace(
              urlComToken
            );

          },
          700
        );


        return;

      }


      /* ===================================================
         TOKEN NÃO ENCONTRADO
      =================================================== */

      console.warn(
        "⚠️ TOKEN NÃO ENCONTRADO"
      );


      mostrarMensagem(
        "Token não encontrado. Redirecionando..."
      );


      /*
       * Sem token:
       * vai para a URL normal.
       */

      setTimeout(
        function() {

          window.location.replace(
            URL_APP_RH
          );

        },
        700
      );

    }


    /* =====================================================
       IFRAME
       
       IMPORTANTE:
       O iframe só recebe a URL depois que o token
       for verificado.
    ===================================================== */

    /*
     * NÃO colocamos src diretamente no HTML.
     *
     * Isso evita que o Google Apps Script abra primeiro
     * sem token.
     */


    frame.addEventListener(
      "load",
      function() {

        loading.classList.add(
          "hidden"
        );


        console.log(
          "🌐 Iframe carregado."
        );

      }
    );


    /* =====================================================
       CONEXÃO
    ===================================================== */

    function updateConnection() {

      offline.style.display =
        navigator.onLine
          ? "none"
          : "block";

    }


    window.addEventListener(
      "online",
      updateConnection
    );


    window.addEventListener(
      "offline",
      updateConnection
    );


    updateConnection();


    /* =====================================================
       SERVICE WORKER
    ===================================================== */

    if(
      "serviceWorker" in navigator
    ) {

      window.addEventListener(
        "load",
        function() {

          navigator.serviceWorker
            .register(
              "./sw.js"
            )
            .then(
              function(registration) {

                console.log(
                  "✅ Service Worker registrado:",
                  registration.scope
                );

              }
            )
            .catch(
              function(error) {

                console.error(
                  "❌ Erro no Service Worker:",
                  error
                );

              }
            );

        }
      );

    }


    /* =====================================================
       INSTALAÇÃO PWA
    ===================================================== */

    let deferredPrompt =
      null;


    window.addEventListener(
      "beforeinstallprompt",
      function(event) {

        event.preventDefault();


        deferredPrompt =
          event;


        installButton.style.display =
          "block";

      }
    );


    installButton.addEventListener(
      "click",
      async function() {

        if(!deferredPrompt) {

          return;

        }


        deferredPrompt.prompt();


        await deferredPrompt.userChoice;


        deferredPrompt =
          null;


        installButton.style.display =
          "none";

      }
    );


    window.addEventListener(
      "appinstalled",
      function() {

        installButton.style.display =
          "none";


        console.log(
          "📱 Aplicativo instalado."
        );

      }
    );


    /* =====================================================
       INICIALIZAÇÃO
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {

        console.log("");
        console.log(
          "======================================"
        );

        console.log(
          "🚀 APP RH INICIADO"
        );

        console.log(
          "======================================"
        );

        console.log(
          "Banco:",
          NOME_BANCO
        );

        console.log(
          "Store:",
          NOME_STORE
        );

        console.log(
          "Chave:",
          CHAVE_USUARIO
        );


        /*
         * Primeiro verifica o token.
         * Somente depois faz o redirecionamento.
         */

        iniciarSistema();

      }
    );


  </script>


</body>

</html>
