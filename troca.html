<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
             initial-scale=1,
             maximum-scale=1,
             viewport-fit=cover"
>

<meta name="theme-color" content="#0f172a">

<title>Trocas - App RH</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #f1f5f9;
}

body {
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
}

/* CABEÇALHO */

.header {
    height: 58px;
    background: #0f172a;
    color: white;

    display: flex;
    align-items: center;

    padding: 0 14px;

    gap: 12px;

    position: relative;
    z-index: 10;
}

.btn-voltar {

    border: 0;

    background: rgba(255,255,255,0.12);

    color: white;

    width: 42px;
    height: 42px;

    border-radius: 12px;

    font-size: 22px;

    cursor: pointer;

    display: flex;
    align-items: center;
    justify-content: center;

}

.titulo {

    font-size: 18px;
    font-weight: 700;

}

/* WEBVIEW */

.webview {

    width: 100%;
    height: calc(100vh - 58px);

    border: 0;

    display: block;

    background: white;
}

</style>

</head>

<body>

<header class="header">

    <button
        class="btn-voltar"
        onclick="location.href='./home.html'"
        aria-label="Voltar"
    >
        ←
    </button>

    <div class="titulo">
        Protocolo de Folga
    </div>

</header>

<iframe
    class="webview"
    src="https://script.google.com/a/*/macros/s/AKfycbxsgfPEHOfP8qn9qF33-bVQfjfUtwQXtBDTNc1EH0gIjXutRvaqIaHYkijj3sB-E_Q/exec"
    allow="clipboard-read; clipboard-write"
    loading="eager"
></iframe>

</body>

</html>
