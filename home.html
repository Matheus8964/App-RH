<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0f172a">

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="App RH"
  >

  <title>App RH</title>


  <!-- =====================================================
       STORAGE DO APP
       ===================================================== -->

  <script src="./storage.js"></script>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html {
      width: 100%;
      min-height: 100%;
      background: #f1f5f9;
    }


    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          160deg,
          #0f172a 0%,
          #172554 35%,
          #f1f5f9 35.1%,
          #f1f5f9 100%
        );

      color: #0f172a;

      overflow-x: hidden;

      padding-top:
        env(safe-area-inset-top);

      padding-bottom:
        env(safe-area-inset-bottom);

      padding-left:
        env(safe-area-inset-left);

      padding-right:
        env(safe-area-inset-right);
    }


    button {
      font-family: inherit;
    }


    .app {
      width: 100%;
      max-width: 620px;

      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;

      padding:
        24px
        20px
        calc(
          30px +
          env(safe-area-inset-bottom)
        );

      position: relative;
    }


    .header {
      color: white;

      padding:
        8px
        2px
        30px;
    }


    .header-top {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;
    }


    .brand {
      display: flex;

      align-items: center;

      gap: 13px;
    }


    .logo {
      width: 52px;
      height: 52px;
      min-width: 52px;

      border-radius: 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.14);

      border:
        1px solid
        rgba(255,255,255,0.18);

      backdrop-filter:
        blur(10px);

      -webkit-backdrop-filter:
        blur(10px);

      font-size: 25px;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.15);
    }


    .brand-text h1 {
      margin: 0;

      font-size: 23px;

      font-weight: 800;

      letter-spacing: -0.5px;
    }


    .brand-text span {
      display: block;

      margin-top: 3px;

      font-size: 12px;

      color:
        rgba(255,255,255,0.68);
    }


    .user-card {
      margin-top: 22px;

      display: flex;

      align-items: center;

      gap: 13px;

      padding:
        14px
        16px;

      border-radius: 18px;

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid
        rgba(255,255,255,0.13);

      backdrop-filter:
        blur(12px);

      -webkit-backdrop-filter:
        blur(12px);
    }


    .user-icon {
      width: 42px;
      height: 42px;
      min-width: 42px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.15);

      font-size: 20px;
    }


    .user-info {
      min-width: 0;
      flex: 1;
    }


    .user-label {
      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;

      color:
        rgba(255,255,255,0.58);
    }


    .user-name {
      margin-top: 3px;

      font-size: 15px;

      font-weight: 700;

      color: white;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .user-id {
      margin-top: 4px;

      font-size: 11px;

      font-weight: 500;

      color:
        rgba(255,255,255,0.65);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    .content {
      background:
        rgba(255,255,255,0.97);

      border-radius: 28px;

      padding:
        22px
        18px
        20px;

      box-shadow:
        0 20px 55px
        rgba(15,23,42,0.16);

      border:
        1px solid
        rgba(255,255,255,0.8);
    }


    .section-title {
      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 17px;

      padding-left: 2px;
    }


    .section-title-icon {
      width: 34px;
      height: 34px;
      min-width: 34px;

      border-radius: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eff6ff;

      font-size: 17px;
    }


    .section-title-text {
      min-width: 0;
    }


    .section-title-text h2 {
      margin: 0;

      font-size: 17px;

      font-weight: 800;

      letter-spacing: -0.2px;
    }


    .section-title-text p {
      margin:
        2px
        0
        0;

      font-size: 11px;

      color: #64748b;
    }


    .menu {
      display: flex;

      flex-direction: column;

      gap: 11px;
    }


    .menu-button {
      width: 100%;

      min-height: 72px;

      border: 0;

      border-radius: 18px;

      padding:
        10px
        13px;

      display: flex;

      align-items: center;

      text-align: left;

      gap: 13px;

      background: #ffffff;

      border:
        1px solid
        #e2e8f0;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 3px 10px
        rgba(15,23,42,0.04);

      position: relative;

      overflow: hidden;

      appearance: none;

      -webkit-appearance: none;
    }


    .menu-button::after {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background: #2563eb;

      opacity: 0;

      transition:
        opacity 0.15s ease;
    }


    .menu-button:hover {
      background: #f8fafc;

      box-shadow:
        0 7px 18px
        rgba(15,23,42,0.08);

      transform:
        translateY(-1px);
    }


    .menu-button:hover::after {
      opacity: 1;
    }


    .menu-button:active {
      transform:
        scale(0.985);

      background:
        #f1f5f9;

      box-shadow: none;
    }


    .menu-button:focus {
      outline: none;
    }


    .menu-button:focus-visible {
      outline:
        3px solid
        rgba(37,99,235,0.25);

      outline-offset: 2px;
    }


    .menu-icon {
      width: 47px;
      height: 47px;
      min-width: 47px;

      border-radius: 14px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 21px;
    }


    .menu-info {
      flex: 1;
      min-width: 0;
    }


    .menu-title {
      font-size: 14px;

      font-weight: 750;

      color: #0f172a;

      line-height: 1.25;
    }


    .menu-description {
      margin-top: 4px;

      font-size: 11px;

      line-height: 1.35;

      color: #64748b;
    }


    .arrow {
      width: 28px;
      height: 28px;
      min-width: 28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        #f8fafc;

      color:
        #64748b;

      font-size: 17px;

      font-weight: 600;
    }


    .icon-troca {
      background: #eff6ff;
    }


    .icon-folga {
      background: #f0fdf4;
    }


    .icon-atestado {
      background: #fff7ed;
    }


    .icon-banco {
      background: #f5f3ff;
    }


    .icon-treinamento {
      background: #ecfeff;
    }


    .icon-suporte {
      background: #fef2f2;
    }


    .icon-alarme {
      background: #fff7ed;
    }


    .footer {
      text-align: center;

      margin-top: 19px;

      padding: 4px;

      color:
        #94a3b8;

      font-size: 10px;

      line-height: 1.5;
    }


    .footer strong {
      color:
        #64748b;
    }


    .loading {
      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        #0f172a;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }


    .loading.hidden {
      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    .loading-content {
      text-align: center;

      color: white;
    }


    .spinner {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,0.18);

      border-top-color:
        white;

      animation:
        girar 0.8s linear infinite;

      margin:
        0
        auto
        14px;
    }


    .loading-text {
      font-size: 12px;

      color:
        rgba(255,255,255,0.65);
    }


    @keyframes girar {

      to {
        transform:
          rotate(360deg);
      }

    }


    .menu-button.carregando {
      pointer-events: none;

      opacity: 0.7;
    }


    .menu-button.carregando .arrow {
      animation:
        girar 0.7s linear infinite;
    }


    /* =====================================================
       MODAL DE TESTE
    ====================================================== */

    .modal-teste {
      position: fixed;

      inset: 0;

      z-index: 10000;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(15,23,42,0.75);

      backdrop-filter:
        blur(5px);

      -webkit-backdrop-filter:
        blur(5px);
    }


    .modal-teste.hidden {
      display: none;
    }


    .modal-teste-caixa {
      width: 100%;

      max-width: 430px;

      background: white;

      border-radius: 22px;

      padding: 22px;

      box-shadow:
        0 25px 70px
        rgba(0,0,0,0.30);
    }


    .modal-teste-titulo {
      font-size: 19px;

      font-weight: 800;

      color: #0f172a;

      margin-bottom: 7px;
    }


    .modal-teste-subtitulo {
      font-size: 12px;

      color: #64748b;

      margin-bottom: 18px;
    }


    .modal-teste-item {
      margin-bottom: 12px;

      padding: 12px;

      border-radius: 12px;

      background: #f8fafc;

      border:
        1px solid
        #e2e8f0;

      word-break: break-word;
    }


    .modal-teste-label {
      display: block;

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 0.7px;

      color: #64748b;

      margin-bottom: 5px;
    }


    .modal-teste-valor {
      font-size: 12px;

      color: #0f172a;

      font-weight: 600;

      line-height: 1.4;
    }


    .modal-teste-botao {
      width: 100%;

      border: 0;

      border-radius: 13px;

      padding: 13px;

      margin-top: 6px;

      background: #0f172a;

      color: white;

      font-size: 14px;

      font-weight: 700;

      cursor: pointer;
    }


    .modal-teste-secundario {
      width: 100%;

      border: 1px solid #e2e8f0;

      border-radius: 13px;

      padding: 13px;

      margin-top: 10px;

      background: #f8fafc;

      color: #0f172a;

      font-size: 13px;

      font-weight: 700;

      cursor: pointer;
    }


    @media (max-width: 380px) {

      .app {
        padding-left: 14px;
        padding-right: 14px;
        padding-top: 18px;
      }


      .header {
        padding-bottom: 22px;
      }


      .brand-text h1 {
        font-size: 21px;
      }


      .logo {
        width: 47px;
        height: 47px;
        min-width: 47px;
        font-size: 22px;
      }


      .content {
        padding:
          19px
          14px
          17px;

        border-radius: 24px;
      }


      .menu-button {
        min-height: 67px;

        padding:
          9px
          10px;

        gap: 10px;
      }


      .menu-icon {
        width: 43px;
        height: 43px;

        min-width: 43px;

        font-size: 19px;
      }


      .menu-title {
        font-size: 13px;
      }


      .menu-description {
        font-size: 10px;
      }

    }


    @media (max-height: 700px) {

      .app {
        padding-top: 14px;
      }


      .header {
        padding-bottom: 17px;
      }


      .user-card {
        margin-top: 15px;
      }


      .content {
        padding-top: 16px;
      }


      .menu {
        gap: 8px;
      }


      .menu-button {
        min-height: 62px;
      }

    }


    @media (min-width: 700px) {

      body {
        display: flex;
        justify-content: center;
      }


      .app {
        padding-top: 40px;
      }


      .header {
        padding-bottom: 35px;
      }


      .content {
        padding:
          25px
          23px;
      }


      .menu-button {
        min-height: 78px;
      }


      .menu-title {
        font-size: 15px;
      }


      .menu-description {
        font-size: 12px;
      }

    }


    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }

    }

  </style>

</head>


<body>

  <script>


    /* =====================================================
       CARREGAR USUÁRIO
    ====================================================== */

    async function carregarUsuario() {


      try {


        const params =
          new URLSearchParams(
            window.location.search
          );


        /* =================================================
           DADOS RECEBIDOS PELA URL
        ================================================= */

        const nomeURL =
          String(
            params.get("nome") || ""
          ).trim();


        const idURL =
          String(
            params.get("id") || ""
          ).trim();


        const tokenURL =
          String(
            params.get("token") || ""
          ).trim();


        console.log(
          "================================="
        );

        console.log(
          "APP RH - CARREGAMENTO"
        );

        console.log(
          "Nome URL:",
          nomeURL
        );

        console.log(
          "ID URL:",
          idURL
        );

        console.log(
          "Token URL:",
          tokenURL
        );

        console.log(
          "================================="
        );


        /* =================================================
           BUSCA USUÁRIO JÁ SALVO
        ================================================= */

        let usuarioSalvo =
          null;


        try {

          usuarioSalvo =
            await obterUsuarioRH();

        }
        catch(erro) {

          console.error(
            "Erro ao ler IndexedDB:",
            erro
          );

        }


        console.log(
          "Usuário encontrado no IndexedDB:",
          usuarioSalvo
        );


        /* =================================================
           SE A URL TEM TOKEN
           É UM NOVO LOGIN/ACESSO.
        ================================================= */

        if(tokenURL) {


          const usuarioNovo = {

            id:
              idURL ||
              (
                usuarioSalvo &&
                usuarioSalvo.id
              ) ||
              "",

            nome:
              nomeURL ||
              (
                usuarioSalvo &&
                usuarioSalvo.nome
              ) ||
              "",

            cargo:
              (
                usuarioSalvo &&
                usuarioSalvo.cargo
              ) ||
              "",

            token:
              tokenURL

          };


          console.log(
            "SALVANDO NOVO USUÁRIO NO INDEXEDDB:",
            usuarioNovo
          );


          await salvarUsuarioRH(
            usuarioNovo
          );


          usuarioSalvo =
            await obterUsuarioRH();


          console.log(
            "USUÁRIO CONFIRMADO APÓS SALVAR:",
            usuarioSalvo
          );

        }


        /* =================================================
           NENHUM DADO NA URL
           USA O QUE JÁ ESTÁ SALVO.
        ================================================= */

        if(!usuarioSalvo) {


          console.warn(
            "Nenhum usuário encontrado no IndexedDB."
          );


          mostrarUsuario(
            "",
            ""
          );


          abrirModalTeste(
            null
          );


          return;

        }


        /* =================================================
           MOSTRAR USUÁRIO
        ================================================= */

        mostrarUsuario(
          usuarioSalvo.nome,
          usuarioSalvo.id
        );


        /* =================================================
           MOSTRA MODAL DE TESTE
        ================================================= */

        abrirModalTeste(
          usuarioSalvo
        );


        /* =================================================
           LIMPA SOMENTE A URL
           
           IMPORTANTE:
           ISSO NÃO APAGA O INDEXEDDB.
        ================================================= */

        if(
          params.has("nome") ||
          params.has("id") ||
          params.has("token")
        ) {


          window.history.replaceState(
            {},
            document.title,
            window.location.pathname
          );


        }


      }
      catch(erro) {


        console.error(
          "ERRO AO CARREGAR USUÁRIO:",
          erro
        );


        mostrarUsuario(
          "",
          ""
        );


        abrirModalErro(
          erro
        );

      }


    }


    /* =====================================================
       MOSTRAR USUÁRIO
    ===================================================== */

    function mostrarUsuario(
      nome,
      id
    ) {


      const elementoNome =
        document.getElementById(
          "nomeUsuario"
        );


      const elementoId =
        document.getElementById(
          "idUsuario"
        );


      if(elementoNome) {

        elementoNome.textContent =
          nome ||
          "Usuário não identificado";

      }


      if(elementoId) {

        elementoId.textContent =
          "ID: " +
          (
            id ||
            "Não informado"
          );

      }

    }


    /* =====================================================
       MODAL DE TESTE
    ===================================================== */

    function abrirModalTeste(
      usuario
    ) {


      const modal =
        document.getElementById(
          "modalTeste"
        );


      if(!modal) {
        return;
      }


      const token =
        usuario &&
        usuario.token
          ?
            usuario.token
          :
            "";


      const nome =
        usuario &&
        usuario.nome
          ?
            usuario.nome
          :
            "";


      const id =
        usuario &&
        usuario.id
          ?
            usuario.id
          :
            "";


      const cargo =
        usuario &&
        usuario.cargo
          ?
            usuario.cargo
          :
            "";


      const elementoToken =
        document.getElementById(
          "testeToken"
        );


      const elementoNome =
        document.getElementById(
          "testeNome"
        );


      const elementoId =
        document.getElementById(
          "testeId"
        );


      const elementoCargo =
        document.getElementById(
          "testeCargo"
        );


      if(elementoToken) {

        elementoToken.textContent =
          token ||
          "❌ Nenhum token armazenado";

      }


      if(elementoNome) {

        elementoNome.textContent =
          nome ||
          "❌ Nenhum nome armazenado";

      }


      if(elementoId) {

        elementoId.textContent =
          id ||
          "❌ Nenhum ID armazenado";

      }


      if(elementoCargo) {

        elementoCargo.textContent =
          cargo ||
          "Não informado";

      }


      modal.classList.remove(
        "hidden"
      );

    }


    /* =====================================================
       LER INDEXEDDB NOVAMENTE
    ====================================================== */

    async function testarArmazenamento() {


      try {


        const usuario =
          await obterUsuarioRH();


        console.log(
          "LEITURA DO INDEXEDDB:",
          usuario
        );


        abrirModalTeste(
          usuario
        );


      }
      catch(erro) {


        console.error(
          erro
        );


        alert(
          "Erro ao ler o armazenamento:\n\n" +
          erro.message
        );

      }

    }


    /* =====================================================
       FECHAR MODAL
    ====================================================== */

    function fecharModalTeste() {


      const modal =
        document.getElementById(
          "modalTeste"
        );


      if(modal) {

        modal.classList.add(
          "hidden"
        );

      }

    }


    /* =====================================================
       MODAL DE ERRO
    ====================================================== */

    function abrirModalErro(
      erro
    ) {


      console.error(
        erro
      );


      const modal =
        document.getElementById(
          "modalTeste"
        );


      if(!modal) {
        return;
      }


      const token =
        document.getElementById(
          "testeToken"
        );


      const nome =
        document.getElementById(
          "testeNome"
        );


      const id =
        document.getElementById(
          "testeId"
        );


      const cargo =
        document.getElementById(
          "testeCargo"
        );


      if(token) {

        token.textContent =
          "ERRO";

      }


      if(nome) {

        nome.textContent =
          erro.message ||
          "Erro desconhecido";

      }


      if(id) {

        id.textContent =
          "--";

      }


      if(cargo) {

        cargo.textContent =
          "--";

      }


      modal.classList.remove(
        "hidden"
      );

    }


    /* =====================================================
       ABRIR PÁGINA
    ====================================================== */

    function abrirPagina(
      pagina,
      botao
    ) {


      const paginas = {


        troca:
          "./menutroca.html",


        folga:
          "./folga.html",


        atestados:
          "./atestados.html",


        banco:
          "./banco.html",


        treinamentos:
          "./treinamentos.html",


        suporte:
          "./suporte.html",


        alarme:
          "./alarme.html",


        upload:
          "./upload.html"


      };


      const destino =
        paginas[pagina];


      if(!destino) {
        return;
      }


      if(botao) {

        botao.classList.add(
          "carregando"
        );

      }


      window.location.href =
        destino;

    }


    /* =====================================================
       INICIALIZAÇÃO
    ====================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {


        const loading =
          document.getElementById(
            "loading"
          );


        try {


          await carregarUsuario();


        }
        catch(erro) {


          console.error(
            erro
          );

        }


        if(loading) {

          loading.classList.add(
            "hidden"
          );

        }


      }
    );


  </script>
