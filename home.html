<!DOCTYPE html>

<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <style>
    * {

    body {

    #loading {

      justify-content: center;

    #loading.hidden {

    }

    .container {

    .topo p {
      margin: 4px 0;

    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .botao {
      border: 0;
      border-radius: 12px;
      background: white;
      padding: 25px 15px;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      transition: .2s;
    }

    .botao:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,.12);
    }

    .botao.carregando {
      opacity: .6;
      pointer-events: none;
    }

    .sair {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #c62828;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>

</head>

<script>

/* =====================================================
   CONFIGURAÇÃO
===================================================== */

const CHAVE_TOKEN = "tokenUsuario";
const CHAVE_NOME = "nomeUsuario";
const CHAVE_ID = "idUsuario";


/* =====================================================
   LER PARÂMETROS DA URL
===================================================== */

function obterParametrosURL() {

  const params =
    new URLSearchParams(window.location.search);

  return {

    params: params,

    nome:
      (params.get("nome") || "").trim(),

    id:
      (params.get("id") || "").trim(),

    token:
      (params.get("token") || "").trim()

  };

}


/* =====================================================
   GRAVAR TOKEN NO LOCAL STORAGE
===================================================== */

function salvarToken(token) {

  console.log("=================================");
  console.log("🔐 SALVANDO TOKEN");
  console.log("=================================");

  console.log("Token recebido:", token);

  if (!token) {

    console.warn(
      "⚠️ Nenhum token recebido para salvar."
    );

    return false;
  }


  try {

    localStorage.setItem(
      CHAVE_TOKEN,
      token
    );


    const tokenSalvo =
      localStorage.getItem(CHAVE_TOKEN);


    console.log(
      "Token depois do localStorage.setItem:",
      tokenSalvo
    );


    if (tokenSalvo === token) {

      console.log(
        "✅ TOKEN GRAVADO E CONFIRMADO NO LOCALSTORAGE"
      );

      return true;

    }


    console.error(
      "❌ TOKEN FOI GRAVADO, MAS A LEITURA NÃO CONFIRMOU."
    );

    return false;

  }

  catch (erro) {

    console.error(
      "❌ ERRO AO GRAVAR TOKEN:",
      erro
    );

    return false;

  }

}


/* =====================================================
   CARREGAR USUÁRIO
===================================================== */

function carregarUsuario() {

  console.log("");
  console.log("=================================");
  console.log("🚀 INICIANDO CARREGAMENTO HOME");
  console.log("=================================");


  const dados =
    obterParametrosURL();


  console.log(
    "URL atual:",
    window.location.href
  );

  console.log(
    "Origem:",
    window.location.origin
  );

  console.log(
    "Nome recebido:",
    dados.nome
  );

  console.log(
    "ID recebido:",
    dados.id
  );

  console.log(
    "Token recebido:",
    dados.token
  );


  /* =================================================
     1. TOKEN
  ================================================= */

  if (dados.token) {

    const salvou =
      salvarToken(dados.token);


    if (!salvou) {

      console.error(
        "❌ NÃO FOI POSSÍVEL SALVAR O TOKEN."
      );

      return;

    }

  }


  /* =================================================
     2. NOME
  ================================================= */

  if (dados.nome) {

    try {

      localStorage.setItem(
        CHAVE_NOME,
        dados.nome
      );

      console.log(
        "✅ Nome salvo:",
        localStorage.getItem(CHAVE_NOME)
      );

    }

    catch (erro) {

      console.error(
        "❌ Erro salvando nome:",
        erro
      );

    }

  }


  /* =================================================
     3. ID
  ================================================= */

  if (dados.id) {

    try {

      localStorage.setItem(
        CHAVE_ID,
        dados.id
      );

      console.log(
        "✅ ID salvo:",
        localStorage.getItem(CHAVE_ID)
      );

    }

    catch (erro) {

      console.error(
        "❌ Erro salvando ID:",
        erro
      );

    }

  }


  /* =================================================
     4. MOSTRAR NA TELA
  ================================================= */

  const elementoNome =
    document.getElementById("nomeUsuario");

  const elementoId =
    document.getElementById("idUsuario");


  if (elementoNome) {

    elementoNome.textContent =
      dados.nome ||
      localStorage.getItem(CHAVE_NOME) ||
      "Usuário";

  }


  if (elementoId) {

    const idFinal =
      dados.id ||
      localStorage.getItem(CHAVE_ID) ||
      "";

    elementoId.textContent =
      "ID: " +
      (idFinal || "Não informado");

  }


  /* =================================================
     5. CONFIRMAÇÃO FINAL
  ================================================= */

  const tokenFinal =
    localStorage.getItem(CHAVE_TOKEN);

  const nomeFinal =
    localStorage.getItem(CHAVE_NOME);

  const idFinal =
    localStorage.getItem(CHAVE_ID);


  console.log("");
  console.log("=================================");
  console.log("📦 DADOS FINAIS NO LOCALSTORAGE");
  console.log("=================================");

  console.log(
    "tokenUsuario:",
    tokenFinal
  );

  console.log(
    "nomeUsuario:",
    nomeFinal
  );

  console.log(
    "idUsuario:",
    idFinal
  );


  if (tokenFinal) {

    console.log(
      "✅ TOKEN ESTÁ PERSISTIDO NO LOCALSTORAGE."
    );

  } else {

    console.error(
      "❌ TOKEN NÃO ESTÁ NO LOCALSTORAGE."
    );

  }


  /* =================================================
     6. LIMPAR SOMENTE OS PARÂMETROS DA URL
     
     IMPORTANTE:
     ISSO NÃO APAGA O LOCALSTORAGE.
  ================================================= */

  if (dados.params.toString()) {

    console.log(
      "🔵 Token ANTES de limpar URL:",
      localStorage.getItem(CHAVE_TOKEN)
    );


    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );


    console.log(
      "🟢 Token DEPOIS de limpar URL:",
      localStorage.getItem(CHAVE_TOKEN)
    );

  }


  console.log("");
  console.log("=================================");
  console.log("🏁 FINAL DO CARREGAMENTO HOME");
  console.log("=================================");

}


/* =====================================================
   ABRIR PÁGINA
===================================================== */

function abrirPagina(pagina, botao) {

  const paginas = {

    troca:
      "./menutroca.html",

    folga:
      "./folga.html",

    atestados:
      "./atestados.html",

    banco:
      "./banco.html",

    treinamentos:
      "./treinamentos.html",

    suporte:
      "./suporte.html",

    alarme:
      "./alarme.html",

    upload:
      "./upload.html"

  };


  const destino =
    paginas[pagina];


  if (!destino) {

    console.error(
      "Página não encontrada:",
      pagina
    );

    return;

  }


  if (botao) {

    botao.classList.add(
      "carregando"
    );

  }


  window.location.href =
    destino;

}


/* =====================================================
   SAIR
===================================================== */

function sair() {

  /*
   * Aqui NÃO apagamos o token automaticamente.
   *
   * Se quiser que o botão "Sair" realmente
   * encerre a sessão, descomente:
   *
   * localStorage.removeItem(CHAVE_TOKEN);
   * localStorage.removeItem(CHAVE_NOME);
   * localStorage.removeItem(CHAVE_ID);
   */

  window.location.href =
    "./index.html";

}


/* =====================================================
   INICIALIZAÇÃO
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  function() {

    carregarUsuario();


    const loading =
      document.getElementById("loading");


    if (loading) {

      loading.classList.add(
        "hidden"
      );

    }

  }
);

</script>

</body>
