<!DOCTYPE html>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #f1f5f9;

    body {

      padding: 0;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:

        BlinkMacSystemFont,

      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    button {
      font-family: inherit;
    }

    .app {
      width: 100%;
      max-width: 620px;

    .header {

        30px;
    }

    .header-top {

      justify-content: space-between;

    }

      align-items: center;

      justify-content: center;

        rgba(255,255,255,0.14);

      border:
        1px solid rgba(255,255,255,0.18);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      box-shadow:

    }

    .brand-text h1 {

      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .brand-text span {

      margin-top: 3px;

      font-size: 12px;

      color:

    }

    .user-card {

      display: flex;
      align-items: center;

      gap: 13px;

      padding:
        14px
        16px;

      border-radius: 18px;

      background:

      border:
        1px solid rgba(255,255,255,0.13);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .user-icon {
      width: 42px;
      height: 42px;
      min-width: 42px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.15);

      font-size: 20px;
    }

    .user-info {
      min-width: 0;
      flex: 1;
    }

    .user-label {

      text-transform: uppercase;

      letter-spacing: 1px;

      color:

    }

    .user-name {

      font-size: 15px;
      font-weight: 700;

      color: white;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;

    .user-id {
      margin-top: 4px;

      font-weight: 500;

      color:
        rgba(255,255,255,0.65);

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .content {

      border-radius: 28px;

      padding:
        22px
        18px
        20px;

      box-shadow:

    .section-title {

    .section-title-icon {

      height: 34px;
      min-width: 34px;

      align-items: center;
      justify-content: center;

      font-size: 17px;

    .section-title-text {
      min-width: 0;
    }

    .section-title-text h2 {

      font-size: 17px;
      font-weight: 800;

      letter-spacing: -0.2px;
    }

    .section-title-text p {
      margin:
        2px
        0
        0;

      font-size: 11px;

      color: #64748b;
    }

    .menu {
      display: flex;

      flex-direction: column;

      gap: 11px;
    }

    .menu-button {
      width: 100%;

      min-height: 72px;

      border: 0;

      border-radius: 18px;

      padding:
        10px
        13px;

      display: flex;

      align-items: center;

      text-align: left;

      gap: 13px;

      background: #ffffff;

      border:
        1px solid
        #e2e8f0;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 3px 10px
        rgba(15,23,42,0.04);

      position: relative;

      overflow: hidden;

      appearance: none;
      -webkit-appearance: none;
    }

    .menu-button::after {
      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background: #2563eb;

      opacity: 0;

      transition:
        opacity 0.15s ease;
    }

    .menu-button:hover {
      background: #f8fafc;

      box-shadow:
        0 7px 18px
        rgba(15,23,42,0.08);

      transform:
        translateY(-1px);
    }

    .menu-button:hover::after {
      opacity: 1;
    }

    .menu-button:active {
      transform:

      background:
        #f1f5f9;

      box-shadow: none;
    }

    .menu-button:focus {
      outline: none;
    }

    .menu-button:focus-visible {
      outline:

      outline-offset: 2px;
    }

    }

    .menu-description {

      line-height: 1.35;

      justify-content: center;

    }

    .loading {

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        #0f172a;

        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-content {
      text-align: center;
      color: white;
    }

    .spinner {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,0.18);

      border-top-color:
        white;

      animation:
        girar 0.8s linear infinite;

      margin:
        0
        auto

    }

    .loading-text {
      font-size: 12px;

      color:
        rgba(255,255,255,0.65);
    }

    @keyframes girar {
      to {
        transform:
          rotate(360deg);
      }
    }

    .menu-button.carregando {
      pointer-events: none;
      opacity: 0.7;
    }

    .menu-button.carregando .arrow {
      animation:
        girar 0.7s linear infinite;
    }

    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>

  <script>

    /* =====================================================
       CONFIGURAÇÃO DO LOGIN
    ====================================================== */

    const BANCO_LOGIN = "AppRHLoginDB";
    const STORE_LOGIN = "login";
    const CHAVE_LOGIN = "usuarioAtual";



    /* =====================================================
       PEGAR PARÂMETROS DA URL
    ====================================================== */

    function obterParametrosURL() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const dados = {};

      params.forEach(
        function(valor, chave) {

          dados[chave] = valor;

        }
      );

      return {

        params: params,

        dados: dados,

        nome:
          (params.get("nome") || "")
          .trim(),

        id:
          (params.get("id") || "")
          .trim(),

        token:
          (params.get("token") || "")
          .trim()

      };

    }



    /* =====================================================
       LOCAL STORAGE — LEITURA SEGURA
    ====================================================== */

    function lerLocal(chave) {

      try {

        return localStorage.getItem(chave) || "";

      } catch (erro) {

        console.error(
          "ERRO AO LER LOCAL STORAGE:",
          erro
        );

        return "";

      }

    }



    /* =====================================================
       LOCAL STORAGE — GRAVAÇÃO SEGURA
    ====================================================== */

    function gravarLocal(chave, valor) {

      try {

        localStorage.setItem(
          chave,
          String(valor ?? "")
        );

        const teste =
          localStorage.getItem(chave);

        if (teste === String(valor ?? "")) {

          console.log(
            "✅ LOCAL STORAGE GRAVOU:",
            chave,
            teste
          );

          return true;

        }

        console.error(
          "❌ LOCAL STORAGE NÃO CONFIRMOU:",
          chave
        );

        return false;

      } catch (erro) {

        console.error(
          "❌ ERRO GRAVANDO LOCAL STORAGE:",
          chave,
          erro
        );

        return false;

      }

    }



    /* =====================================================
       INDEXED DB
    ====================================================== */

    function abrirBancoLogin() {

      return new Promise(
        function(resolve, reject) {

          if (!window.indexedDB) {

            reject(
              new Error(
                "IndexedDB não disponível."
              )
            );

            return;

          }

          const request =
            indexedDB.open(
              BANCO_LOGIN,
              1
            );


          request.onupgradeneeded =
            function(evento) {

              const db =
                evento.target.result;

              if (
                !db.objectStoreNames.contains(
                  STORE_LOGIN
                )
              ) {

                db.createObjectStore(
                  STORE_LOGIN,
                  {
                    keyPath: "chave"
                  }
                );

              }

            };


          request.onsuccess =
            function(evento) {

              resolve(
                evento.target.result
              );

            };


          request.onerror =
            function() {

              reject(
                request.error ||
                new Error(
                  "Erro ao abrir IndexedDB."
                )
              );

            };

        }
      );

    }



    /* =====================================================
       SALVAR LOGIN NO INDEXED DB
    ====================================================== */

    async function salvarLoginIndexedDB(dados) {

      const db =
        await abrirBancoLogin();


      return new Promise(
        function(resolve, reject) {

          const transaction =
            db.transaction(
              STORE_LOGIN,
              "readwrite"
            );


          const store =
            transaction.objectStore(
              STORE_LOGIN
            );


          store.put({

            chave:
              CHAVE_LOGIN,

            usuario:
              dados.usuario,

            nome:
              dados.nome,

            id:
              dados.id,

            token:
              dados.token,

            parametrosURL:
              dados.parametrosURL,

            salvoEm:
              new Date().toISOString()

          });


          transaction.oncomplete =
            function() {

              db.close();

              console.log(
                "✅ LOGIN SALVO NO INDEXED DB"
              );

              resolve(true);

            };


          transaction.onerror =
            function() {

              db.close();

              reject(
                transaction.error ||
                new Error(
                  "Erro ao salvar IndexedDB."
                )
              );

            };

        }
      );

    }



    /* =====================================================
       LER INDEXED DB
    ====================================================== */

    async function lerLoginIndexedDB() {

      try {

        const db =
          await abrirBancoLogin();


        return await new Promise(
          function(resolve, reject) {

            const transaction =
              db.transaction(
                STORE_LOGIN,
                "readonly"
              );


            const store =
              transaction.objectStore(
                STORE_LOGIN
              );


            const request =
              store.get(
                CHAVE_LOGIN
              );


            request.onsuccess =
              function() {

                const resultado =
                  request.result || null;

                db.close();

                resolve(
                  resultado
                );

              };


            request.onerror =
              function() {

                db.close();

                reject(
                  request.error
                );

              };

          }
        );

      } catch (erro) {

        console.warn(
          "⚠️ IndexedDB não pôde ser lido:",
          erro
        );

        return null;

      }

    }



    /* =====================================================
       COOKIE
    ====================================================== */

    function salvarCookieLogin(dados) {

      try {

        const valor =
          encodeURIComponent(
            JSON.stringify({
              nome: dados.nome,
              id: dados.id,
              token: dados.token
            })
          );


        document.cookie =
          "appRHLogin=" +
          valor +
          "; max-age=31536000; path=/; SameSite=Lax";


        console.log(
          "🍪 COOKIE DE LOGIN GRAVADO"
        );

        return true;

      } catch (erro) {

        console.warn(
          "⚠️ Cookie não disponível:",
          erro
        );

        return false;

      }

    }



    /* =====================================================
       SESSION STORAGE
    ====================================================== */

    function salvarSessao(dados) {

      let sucesso = false;

      try {

        sessionStorage.setItem(
          "usuario",
          JSON.stringify(
            dados.usuario
          )
        );

        sessionStorage.setItem(
          "nomeUsuario",
          dados.nome
        );

        sessionStorage.setItem(
          "idUsuario",
          dados.id
        );

        sessionStorage.setItem(
          "tokenUsuario",
          dados.token
        );

        sessionStorage.setItem(
          "parametrosURL",
          JSON.stringify(
            dados.parametrosURL
          )
        );


        if (
          sessionStorage.getItem(
            "tokenUsuario"
          ) === dados.token
        ) {

          sucesso = true;

          console.log(
            "✅ SESSION STORAGE GRAVOU O TOKEN"
          );

        }

      } catch (erro) {

        console.warn(
          "⚠️ Session Storage não disponível:",
          erro
        );

      }

      return sucesso;

    }



    /* =====================================================
       FUNÇÃO PRINCIPAL DE PERSISTÊNCIA
       
       ESTA É A FUNÇÃO MAIS IMPORTANTE.
       
       O TOKEN É GRAVADO EM VÁRIOS LUGARES.
    ====================================================== */

    async function salvarLoginNoDispositivo(dados) {

      console.log("");
      console.log(
        "========================================"
      );
      console.log(
        "🔐 INICIANDO PERSISTÊNCIA DO LOGIN"
      );
      console.log(
        "========================================"
      );

      console.log(
        "Nome:",
        dados.nome
      );

      console.log(
        "ID:",
        dados.id
      );

      console.log(
        "TOKEN:",
        dados.token
      );


      if (!dados.token) {

        console.error(
          "❌ NÃO FOI POSSÍVEL SALVAR: TOKEN VAZIO"
        );

        return false;

      }



      /* =================================================
         1 — LOCAL STORAGE
      ================================================= */

      const localUsuario =
        gravarLocal(
          "usuario",
          JSON.stringify(
            dados.usuario
          )
        );


      const localNome =
        gravarLocal(
          "nomeUsuario",
          dados.nome
        );


      const localId =
        gravarLocal(
          "idUsuario",
          dados.id
        );


      const localToken =
        gravarLocal(
          "tokenUsuario",
          dados.token
        );


      const localParametros =
        gravarLocal(
          "parametrosURL",
          JSON.stringify(
            dados.parametrosURL
          )
        );


      const localMarcador =
        gravarLocal(
          "loginSalvoNoDispositivo",
          "true"
        );


      gravarLocal(
        "loginSalvoEm",
        new Date().toISOString()
      );



      /* =================================================
         CONFIRMAÇÃO DO LOCAL STORAGE
      ================================================= */

      const tokenLocal =
        lerLocal(
          "tokenUsuario"
        );


      console.log(
        "🔎 TOKEN APÓS GRAVAÇÃO:",
        tokenLocal
      );


      if (
        tokenLocal === dados.token
      ) {

        console.log(
          "🔥🔥🔥 TOKEN ESTÁ NO LOCAL STORAGE 🔥🔥🔥"
        );

      } else {

        console.error(
          "❌ TOKEN NÃO FOI CONFIRMADO NO LOCAL STORAGE"
        );

      }



      /* =================================================
         2 — INDEXED DB
      ================================================= */

      let indexed = false;

      try {

        await salvarLoginIndexedDB(
          dados
        );

        const testeIndexed =
          await lerLoginIndexedDB();


        if (
          testeIndexed &&
          testeIndexed.token === dados.token
        ) {

          indexed = true;

          console.log(
            "🔥 TOKEN CONFIRMADO NO INDEXED DB"
          );

        } else {

          console.error(
            "❌ INDEXED DB NÃO CONFIRMOU O TOKEN"
          );

        }

      } catch (erro) {

        console.error(
          "❌ ERRO NO INDEXED DB:",
          erro
        );

      }



      /* =================================================
         3 — COOKIE
      ================================================= */

      const cookie =
        salvarCookieLogin(
          dados
        );



      /* =================================================
         4 — SESSION STORAGE
      ================================================= */

      const session =
        salvarSessao(
          dados
        );



      /* =================================================
         RESULTADO FINAL
      ================================================= */

      console.log("");
      console.log(
        "========================================"
      );
      console.log(
        "📦 RESULTADO DA PERSISTÊNCIA"
      );
      console.log(
        "========================================"
      );


      console.table({

        localStorage:
          localToken === dados.token,

        indexedDB:
          indexed,

        cookie:
          cookie,

        sessionStorage:
          session,

        token:
          dados.token

      });


      console.log(
        "========================================"
      );


      if (
        localToken === dados.token ||
        indexed
      ) {

        console.log(
          "✅ LOGIN PERSISTIDO COM SUCESSO"
        );

        return true;

      }


      console.error(
        "🚨🚨🚨 NENHUM MÉTODO CONFIRMOU O TOKEN 🚨🚨🚨"
      );

      return false;

    }



    /* =====================================================
       LER USUÁRIO SALVO
    ====================================================== */

    function lerUsuarioSalvo() {

      /* Primeiro tenta Local Storage */

      try {

        const local =
          localStorage.getItem(
            "usuario"
          );

        if (local) {

          const usuario =
            JSON.parse(local);

          if (usuario) {

            console.log(
              "✅ Usuário recuperado do Local Storage:",
              usuario
            );

            return usuario;

          }

        }

      } catch (erro) {

        console.warn(
          "Erro lendo usuário do Local Storage:",
          erro
        );

      }



      /* Depois tenta Session Storage */

      try {

        const sessao =
          sessionStorage.getItem(
            "usuario"
          );

        if (sessao) {

          const usuario =
            JSON.parse(sessao);

          if (usuario) {

            console.log(
              "✅ Usuário recuperado do Session Storage:",
              usuario
            );

            return usuario;

          }

        }

      } catch (erro) {

        console.warn(
          "Erro lendo usuário do Session Storage:",
          erro
        );

      }


      return null;

    }



    /* =====================================================
       CARREGAR USUÁRIO
    ====================================================== */

    async function carregarUsuario() {

      console.log("");
      console.log(
        "========================================"
      );
      console.log(
        "🚀 INICIANDO CARREGAMENTO DO USUÁRIO"
      );
      console.log(
        "========================================"
      );


      const url =
        obterParametrosURL();


      console.log(
        "PARÂMETROS DA URL:",
        url.dados
      );


      const elementoNome =
        document.getElementById(
          "nomeUsuario"
        );


      const elementoId =
        document.getElementById(
          "idUsuario"
        );



      /* =================================================
         PRIMEIRO:
         VERIFICA SE VEIO TOKEN PELA URL
      ================================================= */

      if (
        url.token
      ) {

        console.log(
          "🔥 TOKEN RECEBIDO PELA URL:"
        );

        console.log(
          url.token
        );


        const usuarioURL = {

          nome:
            url.nome,

          id:
            url.id,

          token:
            url.token

        };


        const dadosURL = {

          usuario:
            usuarioURL,

          nome:
            url.nome,

          id:
            url.id,

          token:
            url.token,

          parametrosURL:
            url.dados

        };


        /*
         * SALVA IMEDIATAMENTE.
         *
         * NÃO ESPERA MODAL.
         * NÃO ESPERA CLIQUE.
         */

        await salvarLoginNoDispositivo(
          dadosURL
        );


        console.log(
          "🔥 TOKEN DA URL FOI ENVIADO PARA PERSISTÊNCIA"
        );

      }



      /* =================================================
         AGORA PROCURA USUÁRIO SALVO
      ================================================= */

      let usuario =
        lerUsuarioSalvo();



      /* =================================================
         SE NÃO EXISTIR LOCAL/SESSION,
         TENTA INDEXED DB
      ================================================= */

      if (!usuario) {

        console.log(
          "Local/Session não possuem usuário."
        );

        console.log(
          "Tentando IndexedDB..."
        );


        const recuperado =
          await lerLoginIndexedDB();


        if (
          recuperado &&
          recuperado.usuario
        ) {

          console.log(
            "🔥 LOGIN ENCONTRADO NO INDEXED DB:",
            recuperado
          );


          usuario =
            recuperado.usuario;


          /*
           * Restaura tudo no Local Storage
           */

          gravarLocal(
            "usuario",
            JSON.stringify(
              recuperado.usuario
            )
          );


          gravarLocal(
            "nomeUsuario",
            recuperado.nome || ""
          );


          gravarLocal(
            "idUsuario",
            recuperado.id || ""
          );


          gravarLocal(
            "tokenUsuario",
            recuperado.token || ""
          );


          gravarLocal(
            "parametrosURL",
            JSON.stringify(
              recuperado.parametrosURL || {}
            )
          );


          gravarLocal(
            "loginSalvoNoDispositivo",
            "true"
          );


          salvarSessao(
            recuperado
          );

        }

      }



      /* =================================================
         LÊ OS DADOS SALVOS
      ================================================= */

      const nomeSalvo =
        lerLocal(
          "nomeUsuario"
        ) ||
        sessionStorage.getItem(
          "nomeUsuario"
        ) ||
        "";


      const idSalvo =
        lerLocal(
          "idUsuario"
        ) ||
        sessionStorage.getItem(
          "idUsuario"
        ) ||
        "";


      const tokenSalvo =
        lerLocal(
          "tokenUsuario"
        ) ||
        sessionStorage.getItem(
          "tokenUsuario"
        ) ||
        "";



      /* =================================================
         MONTA DADOS FINAIS
      ================================================= */

      const nome =
        (
          url.nome ||

          (
            usuario &&
            (
              usuario.nome ||
              usuario.nomeCompleto ||
              usuario.NOME ||
              usuario["NOME COMPLETO"]
            )
          ) ||

          nomeSalvo ||

          ""
        ).trim();


      const id =
        String(

          url.id ||

          (
            usuario &&
            (
              usuario.id ||
              usuario.idUsuario ||
              usuario.ID ||
              usuario.IDUSUARIO ||
              usuario["ID USUARIO"]
            )
          ) ||

          idSalvo ||

          ""

        ).trim();


      const token =
        String(

          url.token ||

          (
            usuario &&
            usuario.token
          ) ||

          tokenSalvo ||

          ""

        ).trim();



      const usuarioFinal = {

        ...(usuario || {}),

        nome:
          nome,

        id:
          id,

        token:
          token

      };


      const dadosLogin = {

        usuario:
          usuarioFinal,

        nome:
          nome,

        id:
          id,

        token:
          token,

        parametrosURL:
          url.dados

      };



      /* =================================================
         MOSTRA NA TELA
      ================================================= */

      if (elementoNome) {

        elementoNome.textContent =
          nome ||
          "Usuário";

      }


      if (elementoId) {

        elementoId.textContent =
          "ID: " +
          (
            id ||
            "Não informado"
          );

      }



      /* =================================================
         SEGURANÇA EXTRA:
         SE TEM TOKEN, GARANTE NOVAMENTE A PERSISTÊNCIA
      ================================================= */

      if (
        token &&
        nome &&
        id
      ) {

        const tokenAgora =
          lerLocal(
            "tokenUsuario"
          );


        if (
          tokenAgora !== token
        ) {

          console.warn(
            "⚠️ Token ainda não estava no Local Storage."
          );


          await salvarLoginNoDispositivo(
            dadosLogin
          );

        } else {

          console.log(
            "✅ TOKEN JÁ ESTÁ PERSISTIDO:",
            tokenAgora
          );

        }

      }



      /* =================================================
         MOSTRA DIAGNÓSTICO FINAL
      ================================================= */

      console.log("");
      console.log(
        "========================================"
      );
      console.log(
        "🔍 DIAGNÓSTICO FINAL DO LOGIN"
      );
      console.log(
        "========================================"
      );


      console.log(
        "URL:",
        window.location.href
      );


      console.log(
        "Nome:",
        nome
      );


      console.log(
        "ID:",
        id
      );


      console.log(
        "Token recebido:",
        token
      );


      console.log(
        "Token no Local Storage:",
        lerLocal(
          "tokenUsuario"
        )
      );


      console.log(
        "Usuário no Local Storage:",
        lerLocal(
          "usuario"
        )
      );


      console.log(
        "Login persistido:",
        lerLocal(
          "loginSalvoNoDispositivo"
        )
      );


      console.log(
        "========================================"
      );



      /* =================================================
         REMOVE TOKEN DA URL SOMENTE DEPOIS
         DE TODA A PERSISTÊNCIA
      ================================================= */

      if (
        Object.keys(
          url.dados
        ).length > 0
      ) {

        try {

          sessionStorage.setItem(
            "parametrosURL",
            JSON.stringify(
              url.dados
            )
          );

        } catch (erro) {}



        /*
         * Só agora limpamos a URL.
         *
         * O token já foi salvo.
         */

        window.history.replaceState(
          {},
          document.title,
          window.location.pathname
        );


        console.log(
          "🧹 Parâmetros removidos da URL após persistência."
        );

      }

    }



    /* =====================================================
       ABRIR PÁGINA
    ====================================================== */

    function abrirPagina(
      pagina,
      botao
    ) {

      const paginas = {

        troca:
          "./menutroca.html",

        folga:
          "./folga.html",

        atestados:
          "./atestados.html",

        banco:
          "./banco.html",

        treinamentos:
          "./treinamentos.html",

        suporte:
          "./suporte.html",

        alarme:
          "./alarme.html",

        upload:
          "./upload.html"

      };


      const destino =
        paginas[pagina];


      if (!destino) {

        return;

      }


      if (botao) {

        botao.classList.add(
          "carregando"
        );

      }


      window.location.href =
        destino;

    }



    /* =====================================================
       INICIALIZAÇÃO
    ====================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      async function() {

        try {

          await carregarUsuario();

        } catch (erro) {

          console.error(
            "🚨 ERRO CRÍTICO AO CARREGAR USUÁRIO:",
            erro
          );

        }


        const loading =
          document.getElementById(
            "loading"
          );


        if (loading) {

          loading.classList.add(
            "hidden"
          );

        }

      }
    );

  </script>
