<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#0f172a">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta name="apple-mobile-web-app-title" content="App RH">

  <title>App RH</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html {
      width: 100%;
      min-height: 100%;
      background: #f1f5f9;
    }


    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          160deg,
          #0f172a 0%,
          #172554 35%,
          #f1f5f9 35.1%,
          #f1f5f9 100%
        );

      color: #0f172a;

      overflow-x: hidden;

      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }


    button {
      font-family: inherit;
    }


    /* ================================
       CONTAINER
    ================================= */

    .app {

      width: 100%;
      max-width: 620px;

      min-height: 100vh;
      min-height: 100dvh;

      margin: 0 auto;

      padding:
        24px
        20px
        calc(30px + env(safe-area-inset-bottom));

      position: relative;
    }


    /* ================================
       CABEÇALHO
    ================================= */

    .header {

      color: white;

      padding:
        8px
        2px
        30px;
    }


    .header-top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;
    }


    .brand {

      display: flex;

      align-items: center;

      gap: 13px;
    }


    .logo {

      width: 52px;
      height: 52px;

      min-width: 52px;

      border-radius: 16px;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.14);

      border:
        1px solid rgba(255,255,255,0.18);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      font-size: 25px;

      box-shadow:
        0 8px 25px rgba(0,0,0,0.15);
    }


    .brand-text h1 {

      margin: 0;

      font-size: 23px;

      font-weight: 800;

      letter-spacing: -0.5px;
    }


    .brand-text span {

      display: block;

      margin-top: 3px;

      font-size: 12px;

      color:
        rgba(255,255,255,0.68);
    }


    /* ================================
       USUÁRIO
    ================================= */

    .user-card {

      margin-top: 22px;

      display: flex;

      align-items: center;

      gap: 13px;

      padding:
        14px
        16px;

      border-radius: 18px;

      background:
        rgba(255,255,255,0.10);

      border:
        1px solid rgba(255,255,255,0.13);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }


    .user-icon {

      width: 42px;
      height: 42px;

      min-width: 42px;

      border-radius: 50%;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.15);

      font-size: 20px;
    }


    .user-info {

      min-width: 0;

      flex: 1;
    }


    .user-label {

      font-size: 10px;

      text-transform: uppercase;

      letter-spacing: 1px;

      color:
        rgba(255,255,255,0.58);
    }


    .user-name {

      margin-top: 3px;

      font-size: 15px;

      font-weight: 700;

      color: white;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* ================================
       ID DO USUÁRIO
    ================================= */

    .user-id {

      margin-top: 4px;

      font-size: 11px;

      font-weight: 500;

      color:
        rgba(255,255,255,0.65);

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* ================================
       CONTEÚDO
    ================================= */

    .content {

      background:
        rgba(255,255,255,0.97);

      border-radius: 28px;

      padding:
        22px
        18px
        20px;

      box-shadow:
        0 20px 55px
        rgba(15,23,42,0.16);

      border:
        1px solid
        rgba(255,255,255,0.8);
    }


    .section-title {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-bottom: 17px;

      padding-left: 2px;
    }


    .section-title-icon {

      width: 34px;
      height: 34px;

      min-width: 34px;

      border-radius: 10px;

      display: flex;

      align-items: center;
      justify-content: center;

      background: #eff6ff;

      font-size: 17px;
    }


    .section-title-text {

      min-width: 0;
    }


    .section-title-text h2 {

      margin: 0;

      font-size: 17px;

      font-weight: 800;

      letter-spacing: -0.2px;
    }


    .section-title-text p {

      margin:
        2px
        0
        0;

      font-size: 11px;

      color: #64748b;
    }


    /* ================================
       MENU
    ================================= */

    .menu {

      display: flex;

      flex-direction: column;

      gap: 11px;
    }


    .menu-button {

      width: 100%;

      min-height: 72px;

      border: 0;

      border-radius: 18px;

      padding:
        10px
        13px;

      display: flex;

      align-items: center;

      text-align: left;

      gap: 13px;

      background: #ffffff;

      border:
        1px solid
        #e2e8f0;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.15s ease;

      box-shadow:
        0 3px 10px
        rgba(15,23,42,0.04);

      position: relative;

      overflow: hidden;

      appearance: none;
      -webkit-appearance: none;
    }


    .menu-button::after {

      content: "";

      position: absolute;

      left: 0;
      top: 0;
      bottom: 0;

      width: 4px;

      background: #2563eb;

      opacity: 0;

      transition:
        opacity 0.15s ease;
    }


    .menu-button:hover {

      background: #f8fafc;

      box-shadow:
        0 7px 18px
        rgba(15,23,42,0.08);

      transform:
        translateY(-1px);
    }


    .menu-button:hover::after {

      opacity: 1;
    }


    .menu-button:active {

      transform:
        scale(0.985);

      background:
        #f1f5f9;

      box-shadow: none;
    }


    .menu-button:focus {

      outline: none;
    }


    .menu-button:focus-visible {

      outline:
        3px solid
        rgba(37,99,235,0.25);

      outline-offset: 2px;
    }


    .menu-icon {

      width: 47px;
      height: 47px;

      min-width: 47px;

      border-radius: 14px;

      display: flex;

      align-items: center;
      justify-content: center;

      font-size: 21px;
    }


    .menu-info {

      flex: 1;

      min-width: 0;
    }


    .menu-title {

      font-size: 14px;

      font-weight: 750;

      color: #0f172a;

      line-height: 1.25;
    }


    .menu-description {

      margin-top: 4px;

      font-size: 11px;

      line-height: 1.35;

      color: #64748b;
    }


    .arrow {

      width: 28px;
      height: 28px;

      min-width: 28px;

      display: flex;

      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background:
        #f8fafc;

      color:
        #64748b;

      font-size: 17px;

      font-weight: 600;
    }


    /* ================================
       CORES
    ================================= */

    .icon-troca {
      background: #eff6ff;
    }


    .icon-folga {
      background: #f0fdf4;
    }


    .icon-atestado {
      background: #fff7ed;
    }


    .icon-banco {
      background: #f5f3ff;
    }


    .icon-treinamento {
      background: #ecfeff;
    }


    .icon-suporte {
      background: #fef2f2;
    }


    .icon-alarme {
      background: #fff7ed;
    }


    /* ================================
       RODAPÉ
    ================================= */

    .footer {

      text-align: center;

      margin-top: 19px;

      padding: 4px;

      color:
        #94a3b8;

      font-size: 10px;

      line-height: 1.5;
    }


    .footer strong {

      color:
        #64748b;
    }


    /* ================================
       LOADING
    ================================= */

    .loading {

      position: fixed;

      inset: 0;

      z-index: 9999;

      display: flex;

      align-items: center;
      justify-content: center;

      background:
        #0f172a;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }


    .loading.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    .loading-content {

      text-align: center;

      color: white;
    }


    .spinner {

      width: 38px;
      height: 38px;

      border-radius: 50%;

      border:
        3px solid
        rgba(255,255,255,0.18);

      border-top-color:
        white;

      animation:
        girar 0.8s linear infinite;

      margin:
        0
        auto
        14px;
    }


    .loading-text {

      font-size: 12px;

      color:
        rgba(255,255,255,0.65);
    }


    @keyframes girar {

      to {

        transform:
          rotate(360deg);
      }
    }


    /* ================================
       BOTÃO CARREGANDO
    ================================= */

    .menu-button.carregando {

      pointer-events: none;

      opacity: 0.7;
    }


    .menu-button.carregando .arrow {

      animation:
        girar 0.7s linear infinite;
    }


    /* ================================
       TELAS PEQUENAS
    ================================= */

    @media (max-width: 380px) {

      .app {

        padding-left: 14px;
        padding-right: 14px;

        padding-top: 18px;
      }


      .header {

        padding-bottom: 22px;
      }


      .brand-text h1 {

        font-size: 21px;
      }


      .logo {

        width: 47px;
        height: 47px;

        min-width: 47px;

        font-size: 22px;
      }


      .content {

        padding:
          19px
          14px
          17px;

        border-radius: 24px;
      }


      .menu-button {

        min-height: 67px;

        padding:
          9px
          10px;

        gap: 10px;
      }


      .menu-icon {

        width: 43px;
        height: 43px;

        min-width: 43px;

        font-size: 19px;
      }


      .menu-title {

        font-size: 13px;
      }


      .menu-description {

        font-size: 10px;
      }
    }


    /* ================================
       ALTURA PEQUENA
    ================================= */

    @media (max-height: 700px) {

      .app {

        padding-top: 14px;
      }


      .header {

        padding-bottom: 17px;
      }


      .user-card {

        margin-top: 15px;
      }


      .content {

        padding-top: 16px;
      }


      .menu {

        gap: 8px;
      }


      .menu-button {

        min-height: 62px;
      }
    }


    /* ================================
       TABLET / DESKTOP
    ================================= */

    @media (min-width: 700px) {

      body {

        display: flex;

        justify-content: center;
      }


      .app {

        padding-top: 40px;
      }


      .header {

        padding-bottom: 35px;
      }


      .content {

        padding:
          25px
          23px;
      }


      .menu-button {

        min-height: 78px;
      }


      .menu-title {

        font-size: 15px;
      }


      .menu-description {

        font-size: 12px;
      }
    }


    /* ================================
       ACESSIBILIDADE
    ================================= */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {

        animation-duration:
          0.01ms !important;

        animation-iteration-count:
          1 !important;

        transition-duration:
          0.01ms !important;
      }
    }

  </style>

</head>

  <script>


    /* =====================================================
       CARREGAR USUÁRIO
    ====================================================== */

    function carregarUsuario() {

  /*
   * ===================================================
   * LÊ OS PARÂMETROS DA URL
   *
   * Exemplo:
   *
   * home.html?nome=Joao&id=001
   * ===================================================
   */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const nomeURL =
    params.get("nome");


  const idURL =
    params.get("id");


  /*
   * ===================================================
   * ELEMENTOS DA TELA
   * ===================================================
   */

  const elementoNome =
    document.getElementById(
      "nomeUsuario"
    );


  const elementoId =
    document.getElementById(
      "idUsuario"
    );


  /*
   * ===================================================
   * TENTA RECUPERAR O USUÁRIO COMPLETO
   * DO LOCALSTORAGE
   * ===================================================
   */

  let usuario = null;


  try {

    const dados =
      localStorage.getItem(
        "usuario"
      );


    if (dados) {

      usuario =
        JSON.parse(dados);

    }

  } catch (erro) {

    console.error(
      "Erro ao ler usuário:",
      erro
    );

  }


  /*
   * ===================================================
   * VARIÁVEIS
   * ===================================================
   */

  let nome = "";

  let id = "";


  /*
   * ===================================================
   * PEGA NOME E ID DO USUÁRIO
   * ===================================================
   */

  if (usuario) {

    nome =
      usuario.nome ||
      usuario.nomeCompleto ||
      usuario.NOME ||
      usuario["NOME COMPLETO"] ||
      "";


    id =
      usuario.id ||
      usuario.idUsuario ||
      usuario.ID ||
      usuario.IDUSUARIO ||
      usuario["ID USUARIO"] ||
      "";

  }


  /*
   * ===================================================
   * SE NÃO ENCONTROU O NOME NO LOCALSTORAGE,
   * PEGA DA URL
   * ===================================================
   */

  if (
    !nome &&
    nomeURL
  ) {

    nome =
      nomeURL;

  }


  /*
   * ===================================================
   * SE NÃO ENCONTROU O ID NO LOCALSTORAGE,
   * PEGA DA URL
   * ===================================================
   */

  if (
    !id &&
    idURL
  ) {

    id =
      idURL;

  }


  /*
   * ===================================================
   * LIMPA E SALVA NOME
   * ===================================================
   */

  if (
    nome &&
    String(nome).trim() !== ""
  ) {

    nome =
      String(nome).trim();


    localStorage.setItem(
      "nomeUsuario",
      nome
    );

  }


  /*
   * ===================================================
   * LIMPA E SALVA ID
   * ===================================================
   */

  if (
    id &&
    String(id).trim() !== ""
  ) {

    id =
      String(id).trim();


    localStorage.setItem(
      "idUsuario",
      id
    );

  }


  /*
   * ===================================================
   * MOSTRA NOME
   * ===================================================
   */

  if (elementoNome) {

    elementoNome.textContent =
      nome ||
      "Usuário";

  }


  /*
   * ===================================================
   * MOSTRA ID
   * ===================================================
   */

  if (elementoId) {

    elementoId.textContent =
      "ID: " +
      (
        id ||
        "Não informado"
      );

  }


  /*
   * ===================================================
   * REMOVE OS PARÂMETROS DA URL
   *
   * Exemplo:
   *
   * ANTES:
   * home.html?nome=Joao&id=001
   *
   * DEPOIS:
   * home.html
   *
   * Os dados continuam salvos no localStorage.
   * ===================================================
   */

  if (
    params.has("nome") ||
    params.has("id")
  ) {

    window.history.replaceState(
      {},
      document.title,
      window.location.pathname
    );

  }

}


    /* =====================================================
       ABRIR PÁGINA
    ====================================================== */

    function abrirPagina(
      pagina,
      botao
    ) {


      const paginas = {

        troca:
          "./menutroca.html",

        folga:
          "./folga.html",

        atestados:
          "./atestados.html",

        banco:
          "./banco.html",

        treinamentos:
          "./treinamentos.html",

        suporte:
          "./suporte.html",

        alarme:
          "./alarme.html",
        upload:
          "./upload.html"

      };


      const destino =
        paginas[pagina];


      if (!destino) {

        return;

      }


      if (botao) {

        botao.classList.add(
          "carregando"
        );

      }


      window.location.href =
        destino;

    }


    /* =====================================================
       INICIALIZAÇÃO
    ====================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      function() {


        carregarUsuario();


        const loading =
          document.getElementById(
            "loading"
          );


        if (loading) {

          loading.classList.add(
            "hidden"
          );

        }

      }
    );


  </script>
