<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>Teste Token</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:20px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:#0f172a;
}

.caixa{

  width:100%;
  max-width:500px;

  background:white;

  border-radius:20px;

  padding:25px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.30);

}

h1{

  margin:0 0 10px;

  font-size:22px;

  color:#0f172a;

}

.subtitulo{

  color:#64748b;

  font-size:13px;

  margin-bottom:25px;

}

.status{

  padding:18px;

  border-radius:14px;

  background:#f8fafc;

  border:1px solid #e2e8f0;

  word-break:break-all;

}

.label{

  font-size:11px;

  text-transform:uppercase;

  letter-spacing:1px;

  color:#64748b;

  margin-bottom:8px;

}

.token{

  font-size:15px;

  font-weight:bold;

  color:#0f172a;

  line-height:1.5;

}

.sucesso{

  margin-top:18px;

  padding:14px;

  border-radius:12px;

  background:#dcfce7;

  color:#166534;

  font-weight:bold;

}

.erro{

  margin-top:18px;

  padding:14px;

  border-radius:12px;

  background:#fee2e2;

  color:#991b1b;

  font-weight:bold;

}

button{

  width:100%;

  margin-top:20px;

  padding:14px;

  border:0;

  border-radius:12px;

  background:#0f172a;

  color:white;

  font-size:14px;

  font-weight:bold;

  cursor:pointer;

}

.info{

  margin-top:20px;

  padding:14px;

  border-radius:12px;

  background:#f1f5f9;

  font-size:12px;

  color:#475569;

  line-height:1.5;

}

</style>

</head>


<body>


<div class="caixa">

  <h1>🔐 Teste do Token</h1>

  <div class="subtitulo">
    Esta página somente verifica o Local Storage.
  </div>


  <div class="status">

    <div class="label">
      Token salvo
    </div>

    <div
      class="token"
      id="token"
    >
      Verificando...
    </div>

  </div>


  <div id="resultado"></div>


  <button
    onclick="verificarToken()"
  >
    🔄 Verificar novamente
  </button>


  <div class="info">

    <b>Chave pesquisada:</b><br>

    tokenUsuario

    <br><br>

    Esta página não recebe token pela URL.
    Ela somente tenta recuperar o token que já
    está salvo no Local Storage deste domínio.

  </div>

</div>


<script>


function verificarToken(){

  const elementoToken =
    document.getElementById("token");

  const resultado =
    document.getElementById("resultado");


  let token = "";


  try{

    token =
      localStorage.getItem(
        "tokenUsuario"
      ) || "";

  }
  catch(erro){

    elementoToken.textContent =
      "ERRO AO ACESSAR LOCAL STORAGE";

    resultado.className =
      "erro";

    resultado.textContent =
      "O navegador bloqueou o acesso ao Local Storage.";

    console.error(erro);

    return;

  }


  console.log(
    "TOKEN ENCONTRADO:",
    token
  );


  if(token){

    elementoToken.textContent =
      token;

    resultado.className =
      "sucesso";

    resultado.textContent =
      "✅ TOKEN ENCONTRADO NO LOCAL STORAGE";

  }
  else{

    elementoToken.textContent =
      "Nenhum token encontrado";

    resultado.className =
      "erro";

    resultado.textContent =
      "❌ NÃO EXISTE tokenUsuario neste Local Storage.";

  }

}


document.addEventListener(
  "DOMContentLoaded",
  function(){

    verificarToken();

  }
);


</script>


</body>

</html>
