<!DOCTYPE html>

<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Teste Token GitHub</title>

<style>

*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  padding:20px;
  min-height:100vh;
  background:#f4f6f8;
  display:flex;
  justify-content:center;
  align-items:center;
}

.card{
  width:420px;
  max-width:100%;
  background:white;
  padding:30px;
  border-radius:12px;
  box-shadow:0 5px 20px rgba(0,0,0,.15);
}

h1{
  text-align:center;
  color:#1565C0;
}

.status{
  padding:15px;
  margin-top:20px;
  background:#f5f5f5;
  border-radius:8px;
  word-break:break-all;
}

.ok{
  color:#087f23;
  font-weight:bold;
}

.erro{
  color:#b71c1c;
  font-weight:bold;
}

</style>

</head>

<body>

<div class="card">

<h1>
Teste de Token
</h1>

<p>
Esta página aguarda um token enviado pelo
Apps Script.
</p>

<div
  id="status"
  class="status"
>
Aguardando token...
</div>

</div>

<script>

const CHAVE_TOKEN =
  "tokenTesteAppsScript";


/*
 * Recebe mensagem enviada pela página
 * do Apps Script.
 */

window.addEventListener(
  "message",
  function(event){

    console.log(
      "Mensagem recebida:",
      event.data
    );


    if(!event.data){
      return;
    }


    if(
      event.data.tipo !==
      "TOKEN_APPS_SCRIPT"
    ){

      return;

    }


    const token =
      event.data.token;


    if(!token){

      document.getElementById(
        "status"
      ).innerHTML =
        '<span class="erro">' +
        '❌ Token vazio' +
        '</span>';

      return;

    }


    /*
     * SALVA NO LOCALSTORAGE
     */

    localStorage.setItem(
      CHAVE_TOKEN,
      token
    );


    document.getElementById(
      "status"
    ).innerHTML =

      '<span class="ok">' +
      '✅ TOKEN RECEBIDO E SALVO' +
      '</span>' +

      '<br><br>' +

      '<strong>Token:</strong><br>' +

      token;

  }
);


/*
 * Ao abrir novamente,
 * verifica se o token continua salvo.
 */

window.addEventListener(
  "load",
  function(){

    const token =
      localStorage.getItem(
        CHAVE_TOKEN
      );


    if(token){

      document.getElementById(
        "status"
      ).innerHTML =

        '<span class="ok">' +
        '✅ TOKEN CONTINUA SALVO' +
        '</span>' +

        '<br><br>' +

        '<strong>Token:</strong><br>' +

        token;

    }

  }
);

</script>

</body>

</html>
