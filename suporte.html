<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Teste Token</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f2f2;
}

.topo {
    padding: 20px;
    background: white;
    text-align: center;
}

.status {
    margin-top: 10px;
    padding: 15px;
    border-radius: 10px;
    background: #fff3cd;
}

.sucesso {
    background: #d4edda;
    color: #155724;
}

.token {
    margin-top: 10px;
    padding: 10px;
    background: #eee;
    border-radius: 8px;
    word-break: break-all;
}

.webview {
    margin: 15px;
    background: white;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 2px 10px rgba(0,0,0,.15);
}

.webview iframe {
    width: 100%;
    height: 400px;
    border: none;
}

button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

</style>

</head>

<body>


<div class="topo">

    <h2>Teste GitHub → Apps Script</h2>

    <div
        id="status"
        class="status"
    >
        ⏳ Aguardando token...
    </div>

    <div
        id="tokenArea"
        class="token"
        style="display:none;"
    ></div>

    <button onclick="verificarToken()">
        🔎 Verificar token salvo
    </button>

    <button onclick="apagarToken()">
        🗑️ Apagar token
    </button>

</div>


<!-- ==========================================
     WEBVIEW DO APPS SCRIPT
========================================== -->

<div class="webview">

    <iframe
        id="webviewAppsScript"
        src="https://script.google.com/macros/s/AKfycbzHA32fnNDd117Uc1SrRCZpGzz0L8YkIQ144SUpckVJ9t3eEaEHIbJYq3b0Ashnr5QyzQ/exec?page=teste"
        allow="clipboard-read; clipboard-write"
    ></iframe>

</div>


<script>


/*
==================================================
RECEBER TOKEN DO APPS SCRIPT
==================================================
*/

window.addEventListener("message", function(event) {

    console.log(
        "Mensagem recebida:",
        event.data
    );


    if (
        event.data &&
        event.data.tipo === "TOKEN_APPS_SCRIPT"
    ) {

        const token =
            event.data.token;


        if (!token) {

            document.getElementById("status").innerHTML =
                "❌ Token vazio.";

            return;
        }


        /*
        SALVA NO LOCALSTORAGE
        */

        localStorage.setItem(
            "tokenTeste",
            token
        );


        /*
        MOSTRA NA TELA
        */

        mostrarToken(token);

    }

});


/*
==================================================
MOSTRAR TOKEN
==================================================
*/

function mostrarToken(token) {

    const status =
        document.getElementById("status");

    const area =
        document.getElementById("tokenArea");


    status.className =
        "status sucesso";


    status.innerHTML =
        "✅ TOKEN RECEBIDO E GUARDADO NO LOCALSTORAGE";


    area.style.display =
        "block";


    area.innerHTML =
        "<strong>Token salvo:</strong><br><br>" +
        token;

}


/*
==================================================
VERIFICAR TOKEN DEPOIS DE REABRIR
==================================================
*/

function verificarToken() {

    const token =
        localStorage.getItem(
            "tokenTeste"
        );


    if (token) {

        mostrarToken(token);

    } else {

        document.getElementById("status").className =
            "status";


        document.getElementById("status").innerHTML =
            "❌ Nenhum token encontrado.";

    }

}


/*
==================================================
APAGAR
==================================================
*/

function apagarToken() {

    localStorage.removeItem(
        "tokenTeste"
    );


    document.getElementById(
        "tokenArea"
    ).style.display = "none";


    document.getElementById(
        "status"
    ).className = "status";


    document.getElementById(
        "status"
    ).innerHTML =
        "🗑️ Token apagado.";

}


/*
==================================================
AO ABRIR
==================================================
*/

window.addEventListener(
    "load",
    function() {

        const token =
            localStorage.getItem(
                "tokenTeste"
            );


        if (token) {

            mostrarToken(token);

        }

    }
);

</script>


</body>

</html>
